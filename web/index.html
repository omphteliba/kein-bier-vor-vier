<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Irgendwo ist immer Vier</title>
  <meta name="description" content="Wo auf der Welt gerade Bierzeit ist – frei nach „Kein Bier vor Vier“. Where in the world it's five o'clock right now.">
  <meta name="theme-color" content="#FDF6E3">
  <meta name="color-scheme" content="light">
  <script>
    // Pick title, icon and install manifest before the page loads, so the
    // browser offers the matching edition for the home screen.
    (function () {
      var lang;
      try { lang = localStorage.getItem('lang'); } catch (e) {}
      if (lang !== 'de' && lang !== 'en') lang = (navigator.language || 'en').slice(0, 2) === 'de' ? 'de' : 'en';
      var e = lang === 'de' ? 'vier' : 'five';
      document.documentElement.lang = lang;
      document.title = lang === 'de' ? 'Irgendwo ist immer Vier' : "5 O'Clock Somewhere";
      document.write('<link rel="manifest" href="manifest-' + lang + '.webmanifest">' +
        '<link rel="icon" type="image/png" href="icons/' + e + '-64.png">' +
        '<link rel="apple-touch-icon" href="icons/' + e + '-180.png">');
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="fonts/aleo.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="app" aria-live="off">
    <header class="top">
      <div id="dial" class="dial" aria-hidden="true"></div>
      <div class="titles">
        <h1 id="title"></h1>
        <p id="tagline" class="soft"></p>
      </div>
      <button id="open-settings" class="icon-button" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L15 3.5h-4L10.7 6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="visually-hidden" id="settings-label"></span>
      </button>
    </header>

    <section class="glass" id="glass" aria-labelledby="saying"></section>
    <section class="card next" id="next"></section>

    <section aria-labelledby="breweries-title">
      <h2 class="section-title" id="breweries-title"></h2>
      <p class="soft small" id="selection-note"></p>
      <div id="carousel"></div>
    </section>

    <section aria-labelledby="upcoming-title">
      <h2 class="section-title" id="upcoming-title"></h2>
      <ol class="upcoming" id="upcoming"></ol>
    </section>

    <button id="install" class="install" type="button" hidden></button>
    <p id="install-hint" class="install-hint" role="status" hidden></p>

    <footer>
      <p id="responsibly"></p>
      <p class="links">
        <a href="https://github.com/omphteliba/kein-bier-vor-vier" rel="noopener">GitHub</a> ·
        <a id="imprint-link" href="impressum.html"></a> ·
        <a id="privacy-link" href="datenschutz.html"></a>
      </p>
    </footer>
  </main>

  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog">
      <h2 id="settings-title"></h2>
      <fieldset>
        <legend id="saying-legend"></legend>
        <label><input type="radio" name="edition" value="auto"> <span id="edition-auto"></span></label>
        <label><input type="radio" name="edition" value="vier"> <span id="edition-vier"></span></label>
        <label><input type="radio" name="edition" value="five"> <span id="edition-five"></span></label>
      </fieldset>
      <fieldset>
        <legend id="language-legend"></legend>
        <label><input type="radio" name="lang" value="auto"> <span id="lang-auto"></span></label>
        <label><input type="radio" name="lang" value="de"> Deutsch</label>
        <label><input type="radio" name="lang" value="en"> English</label>
      </fieldset>
      <div class="dialog-actions"><button id="close-settings" value="close"></button></div>
    </form>
  </dialog>

  <noscript><p class="noscript">Diese Seite braucht JavaScript. · This page needs JavaScript.</p></noscript>
</body>
</html>
