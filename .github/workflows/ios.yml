name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: BeerCore tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generated data is up to date
        run: python3 tools/make_spots.py --check

      - name: Swift tests
        working-directory: ios/BeerCore
        run: swift test
