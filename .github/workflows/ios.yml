name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: BeerCore tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generated data is up to date
        run: python3 tools/make_spots.py --check

      - name: Swift tests
        working-directory: ios/BeerCore
        run: swift test

  apps:
    name: iPhone and Apple Watch apps
    runs-on: macos-15
    timeout-minutes: 60
    needs: core
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen

      - name: Build for the iPhone simulator
        working-directory: ios
        run: >
          xcodebuild -project KeinBierVorVier.xcodeproj -scheme KeinBier
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Build for the Apple Watch simulator
        working-directory: ios
        run: >
          xcodebuild -project KeinBierVorVier.xcodeproj -scheme KeinBierWatch
          -sdk watchsimulator -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Screenshots in the simulators
        working-directory: ios
        run: ./ci-screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ios/screenshots/
