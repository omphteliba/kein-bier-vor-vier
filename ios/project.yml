# XcodeGen project description: `xcodegen` turns this into KeinBierVorVier.xcodeproj.
# Built and tested on GitHub's macOS runners (.github/workflows/ios.yml).
name: KeinBierVorVier
options:
  bundleIdPrefix: de.keinbiervorvier
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  BeerCore:
    path: BeerCore
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  KeinBier:
    type: application
    platform: iOS
    sources: [App, Shared, Resources]
    dependencies:
      - package: BeerCore
      - target: KeinBierWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kein Bier vor Vier
        UILaunchScreen: {}
        UIAppFonts: [Aleo.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Shows how far away the beer o'clock place is.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keinbiervorvier.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  KeinBierWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared, Resources/Shared]
    dependencies:
      - package: BeerCore
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Kein Bier vor Vier
        UIAppFonts: [Aleo.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keinbiervorvier.ios.widget
        TARGETED_DEVICE_FAMILY: "1"

  KeinBierWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared, Resources]
    dependencies:
      - package: BeerCore
      - target: KeinBierWatchWidget
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Kein Bier vor Vier
        WKApplication: true
        WKWatchOnly: true
        UIAppFonts: [Aleo.ttf]
        NSLocationWhenInUseUsageDescription: Shows how far away the beer o'clock place is.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keinbiervorvier.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  KeinBierWatchWidget:
    type: app-extension
    platform: watchOS
    sources: [WatchWidget, Shared, Resources/Shared]
    dependencies:
      - package: BeerCore
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Kein Bier vor Vier
        UIAppFonts: [Aleo.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keinbiervorvier.watch.widget
